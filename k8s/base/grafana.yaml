# ============================================================
# LEDGERBASE — GRAFANA OBSERVABILITY
# ============================================================
#
# PURPOSE:
#
# Deploy Grafana to visualize operational metrics collected
# by the LedgerBase Prometheus server.
#
# ARCHITECTURE:
#
# Accounting Core ───┐
# Reporting Service ─┼──> Prometheus ──> Grafana
# API Gateway ───────┘
#
# DEPLOYMENT:
#
# - Single Grafana instance for local kind development.
# - Persistent storage for dashboard and user settings.
# - Automatically provisioned Prometheus datasource.
# - Automatically provisioned LedgerBase dashboard.
# - Administrator password from a Kubernetes Secret.
# - Internal Kubernetes Service only.
#
# DASHBOARD PROVISIONING:
#
# Two Kubernetes ConfigMaps provide:
#
# 1. The Grafana dashboard provider configuration.
# 2. The LedgerBase dashboard JSON definition.
#
# Dashboard definitions remain version-controlled in Git.
#
# Local access uses kubectl port-forward on port 13000.


# ============================================================
# PROMETHEUS DATASOURCE PROVISIONING
# ============================================================
#
# Configure Grafana to query the Prometheus instance
# deployed in the ledgerbase Kubernetes namespace.
#
# The datasource is provisioned automatically on startup.
# No manual datasource URL configuration is required.

apiVersion: v1
kind: ConfigMap

metadata:
  name: grafana-datasource
  namespace: ledgerbase

  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: ledgerbase

data:
  datasource.yaml: |
    # ========================================================
    # LEDGERBASE — PROMETHEUS DATASOURCE
    # ========================================================

    apiVersion: 1

    datasources:
      - name: Prometheus
        uid: ledgerbase-prometheus
        type: prometheus

        # Grafana's backend queries Prometheus directly.
        access: proxy

        orgId: 1

        url: http://prometheus.ledgerbase.svc.cluster.local:9090

        isDefault: true
        editable: false

        jsonData:
          httpMethod: POST
          timeInterval: 15s

---

# ============================================================
# GRAFANA PERSISTENT STORAGE
# ============================================================
#
# Retain Grafana's SQLite database, dashboard preferences,
# and other application data across Pod restarts.
#
# Do not delete this PVC during redeployment.

apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: grafana-data
  namespace: ledgerbase

  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: ledgerbase

spec:
  accessModes:
    - ReadWriteOnce

  storageClassName: standard

  resources:
    requests:
      storage: 2Gi

---

# ============================================================
# GRAFANA DEPLOYMENT
# ============================================================
#
# Run one Grafana instance with:
#
# - Persistent SQLite storage.
# - Secret-based administrator authentication.
# - Provisioned Prometheus datasource.
# - Provisioned LedgerBase monitoring dashboard.
#
# The dashboard and datasource ConfigMaps are mounted
# read-only into Grafana's configuration directories.

apiVersion: apps/v1
kind: Deployment

metadata:
  name: grafana
  namespace: ledgerbase

  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: ledgerbase

spec:
  replicas: 1

  # Prevent concurrent Grafana Pods from using
  # the same writable SQLite database.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: grafana

  template:

    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: ledgerbase

    spec:

      automountServiceAccountToken: false

      # ------------------------------------------------------
      # NON-ROOT CONTAINER EXECUTION
      # ------------------------------------------------------
      #
      # Grafana's container uses UID 472.
      # fsGroup supports access to the persistent volume.

      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472

      containers:

        - name: grafana

          # ==================================================
          # CONTAINER IMAGE
          # ==================================================

          image: grafana/grafana:13.2.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          # ==================================================
          # GRAFANA CONFIGURATION
          # ==================================================

          env:

            # ------------------------------------------------
            # ADMINISTRATOR AUTHENTICATION
            # ------------------------------------------------
            #
            # Administrator credentials are provided through
            # a Kubernetes Secret.
            #
            # Never store administrator passwords directly
            # in version-controlled YAML manifests.

            - name: GF_SECURITY_ADMIN_USER
              value: "admin"

            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ledgerbase-grafana-admin
                  key: password

            # ------------------------------------------------
            # USER REGISTRATION AND ANONYMOUS ACCESS
            # ------------------------------------------------
            #
            # Disable self-service registration and
            # anonymous access for the local monitoring UI.

            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"

            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"

            # ------------------------------------------------
            # TELEMETRY AND UI CONFIGURATION
            # ------------------------------------------------
            #
            # Disable optional analytics reporting and
            # automatic update checks.
            #
            # Disable external Gravatar avatar requests.

            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"

            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"

            - name: GF_SECURITY_DISABLE_GRAVATAR
              value: "true"

          # ==================================================
          # PERSISTENT DATA AND PROVISIONING
          # ==================================================
          #
          # Grafana uses four mounted volumes:
          #
          # 1. grafana-data
          #    Persistent SQLite database and Grafana state.
          #
          # 2. grafana-datasource
          #    Prometheus datasource provisioning YAML.
          #
          # 3. grafana-dashboard-provider
          #    Dashboard provider provisioning YAML.
          #
          # 4. grafana-dashboard-json
          #    LedgerBase monitoring dashboard definition.
          #
          # Configuration volumes are read-only.

          volumeMounts:

            # ------------------------------------------------
            # GRAFANA PERSISTENT APPLICATION DATA
            # ------------------------------------------------

            - name: grafana-data
              mountPath: /var/lib/grafana

            # ------------------------------------------------
            # PROMETHEUS DATASOURCE CONFIGURATION
            # ------------------------------------------------

            - name: grafana-datasource
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true

            # ------------------------------------------------
            # DASHBOARD PROVIDER CONFIGURATION
            # ------------------------------------------------
            #
            # Grafana scans this directory for dashboard
            # provisioning YAML files on startup.
            #
            # The provider configuration specifies the
            # filesystem directory containing dashboard JSON.

            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true

            # ------------------------------------------------
            # LEDGERBASE DASHBOARD JSON
            # ------------------------------------------------
            #
            # Store version-controlled dashboard JSON files
            # separately from the provider configuration.
            #
            # Grafana loads the dashboard according to
            # the configured filesystem provider.

            - name: grafana-dashboard-json
              mountPath: /etc/grafana/ledgerbase-dashboards
              readOnly: true

          # ==================================================
          # RESOURCE ALLOCATION
          # ==================================================
          #
          # Allocate sufficient resources for the
          # single-instance local Grafana deployment.

          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: "1"
              memory: 768Mi

          # ==================================================
          # CONTAINER SECURITY
          # ==================================================
          #
          # Prevent privilege escalation and drop all
          # Linux capabilities not required by Grafana.

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          # ==================================================
          # STARTUP PROBE
          # ==================================================
          #
          # Allow Grafana time to initialize its database,
          # datasource provisioning, and dashboards.

          startupProbe:
            httpGet:
              path: /api/health
              port: http

            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36

          # ==================================================
          # READINESS PROBE
          # ==================================================
          #
          # Mark Grafana ready after the health endpoint
          # responds successfully.

          readinessProbe:
            httpGet:
              path: /api/health
              port: http

            periodSeconds: 10
            timeoutSeconds: 3

          # ==================================================
          # LIVENESS PROBE
          # ==================================================
          #
          # Restart the container if Grafana becomes
          # persistently unhealthy.

          livenessProbe:
            httpGet:
              path: /api/health
              port: http

            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6

      # ======================================================
      # GRAFANA VOLUME DEFINITIONS
      # ======================================================
      #
      # Persistent data uses the existing PVC.
      #
      # Datasource and dashboard configuration volumes
      # read their content from Kubernetes ConfigMaps.

      volumes:

        # ----------------------------------------------------
        # PERSISTENT GRAFANA STORAGE
        # ----------------------------------------------------

        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data

        # ----------------------------------------------------
        # PROMETHEUS DATASOURCE CONFIGMAP
        # ----------------------------------------------------

        - name: grafana-datasource
          configMap:
            name: grafana-datasource

        # ----------------------------------------------------
        # DASHBOARD PROVIDER CONFIGMAP
        # ----------------------------------------------------
        #
        # Contains the Grafana provider YAML specifying:
        #
        # - Dashboard provider type.
        # - Target Grafana folder.
        # - Dashboard JSON directory.
        # - Dashboard update behavior.

        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-config

        # ----------------------------------------------------
        # DASHBOARD JSON CONFIGMAP
        # ----------------------------------------------------
        #
        # Contains the LedgerBase System Overview dashboard.
        #
        # Its JSON content is supplied from:
        #
        # k8s/base/grafana-dashboard.json
        #
        # The corresponding ConfigMap is created using
        # kubectl --from-file during deployment.

        - name: grafana-dashboard-json
          configMap:
            name: grafana-dashboard-json

---

# ============================================================
# GRAFANA INTERNAL KUBERNETES SERVICE
# ============================================================
#
# Grafana remains accessible only through the
# internal Kubernetes Service.
#
# Developers use port-forward on localhost:13000.
#
# No external NodePort or LoadBalancer is created.

apiVersion: v1
kind: Service

metadata:
  name: grafana
  namespace: ledgerbase

  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: ledgerbase

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: grafana

  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
