# ============================================================
# LEDGERBASE — PROMETHEUS MONITORING
# ============================================================
#
# PURPOSE:
#
# Collect, store, and query operational metrics from
# LedgerBase's Spring Boot microservices.
#
# MONITORED SERVICES:
#
# - Accounting Core: accounting-core:8080
# - Reporting Service: reporting-service:8082
# - API Gateway: gateway:8081
#
# Each Spring Boot application exposes metrics at:
#
# /actuator/prometheus
#
# DEPLOYMENT:
#
# - One Prometheus instance for local kind development.
# - Persistent time-series data storage.
# - Seven-day metric retention.
# - Internal Kubernetes Service only.
#
# SECURITY:
#
# No public NodePort or LoadBalancer is created.
# The Prometheus UI is accessed via kubectl port-forward.
#
# This is not a production high-availability deployment.


# ============================================================
# PROMETHEUS SCRAPE CONFIGURATION
# ============================================================
#
# Prometheus scrapes the three applications through
# their internal Kubernetes Service DNS names.
#
# Static service targets avoid the need to grant
# Kubernetes API permissions for service discovery.

apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config
  namespace: ledgerbase

  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ledgerbase

data:
  prometheus.yml: |
    # ========================================================
    # GLOBAL SCRAPE SETTINGS
    # ========================================================

    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      scrape_timeout: 10s

      external_labels:
        environment: kind-local
        application: ledgerbase

    # ========================================================
    # SCRAPE TARGETS
    # ========================================================

    scrape_configs:

      # ------------------------------------------------------
      # PROMETHEUS SELF-MONITORING
      # ------------------------------------------------------
      - job_name: prometheus

        static_configs:
          - targets:
              - localhost:9090

      # ------------------------------------------------------
      # ACCOUNTING CORE
      # ------------------------------------------------------
      #
      # JVM, HTTP, Kafka client, and application metrics.
      - job_name: accounting-core

        metrics_path: /actuator/prometheus

        static_configs:
          - targets:
              - accounting-core.ledgerbase.svc.cluster.local:8080

      # ------------------------------------------------------
      # REPORTING SERVICE
      # ------------------------------------------------------
      #
      # JVM, HTTP, reporting connection pool metrics.
      - job_name: reporting-service

        metrics_path: /actuator/prometheus

        static_configs:
          - targets:
              - reporting-service.ledgerbase.svc.cluster.local:8082

      # ------------------------------------------------------
      # SPRING CLOUD GATEWAY
      # ------------------------------------------------------
      #
      # Gateway JVM, HTTP, and request latency metrics.
      - job_name: gateway

        metrics_path: /actuator/prometheus

        static_configs:
          - targets:
              - gateway.ledgerbase.svc.cluster.local:8081

---

# ============================================================
# PROMETHEUS PERSISTENT STORAGE
# ============================================================
#
# Store time-series database files on a persistent volume.
#
# Existing monitoring data survives a Prometheus Pod restart.
#
# Do not delete this claim when redeploying Prometheus.

apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: prometheus-data
  namespace: ledgerbase

  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ledgerbase

spec:
  accessModes:
    - ReadWriteOnce

  storageClassName: standard

  resources:
    requests:
      storage: 2Gi

---

# ============================================================
# PROMETHEUS DEPLOYMENT
# ============================================================
#
# Run one monitoring instance.
#
# The Recreate deployment strategy prevents concurrent
# Prometheus Pods from using the same writable data volume.

apiVersion: apps/v1
kind: Deployment

metadata:
  name: prometheus
  namespace: ledgerbase

  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ledgerbase

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus

  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: ledgerbase

    spec:
      automountServiceAccountToken: false

      # ------------------------------------------------------
      # NON-ROOT PERSISTENT STORAGE ACCESS
      # ------------------------------------------------------
      #
      # Prometheus uses the nobody identity (UID 65534).
      # fsGroup grants group access to the mounted volume.

      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534

      containers:
        - name: prometheus

          image: prom/prometheus:v3.16.0
          imagePullPolicy: IfNotPresent

          # ==================================================
          # PROMETHEUS STARTUP CONFIGURATION
          # ==================================================

          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.listen-address=0.0.0.0:9090

          ports:
            - name: http
              containerPort: 9090
              protocol: TCP

          # ==================================================
          # STORAGE AND CONFIGURATION
          # ==================================================

          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
              readOnly: true

            - name: prometheus-data
              mountPath: /prometheus

          # ==================================================
          # RESOURCE ALLOCATION
          # ==================================================

          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: "1"
              memory: 768Mi

          # ==================================================
          # CONTAINER SECURITY
          # ==================================================

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          # ==================================================
          # HEALTH PROBES
          # ==================================================
          #
          # /-/ready confirms readiness for API queries.
          # /-/healthy confirms Prometheus is running.

          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36

          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6

      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config

        - name: prometheus-data
          persistentVolumeClaim:
            claimName: prometheus-data

---

# ============================================================
# PROMETHEUS INTERNAL SERVICE
# ============================================================
#
# Grafana will use the following internal datasource URL:
#
# http://prometheus:9090
#
# Local browser access uses kubectl port-forward.

apiVersion: v1
kind: Service

metadata:
  name: prometheus
  namespace: ledgerbase

  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ledgerbase

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: prometheus

  ports:
    - name: http
      port: 9090
      targetPort: http
      protocol: TCP
