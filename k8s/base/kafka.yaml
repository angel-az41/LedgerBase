# ============================================================
# LEDGERBASE — APACHE KAFKA KRAFT BROKER
# ============================================================
#
# PURPOSE:
#
# Deploy Apache Kafka as the asynchronous messaging
# infrastructure for LedgerBase's transactional outbox.
#
# ARCHITECTURE:
#
# Accounting Core
#     |
#     v
# PostgreSQL Transactional Outbox
#     |
#     v
# Outbox Publisher
#     |
#     v
# Kafka Broker
#     |
#     v
# Kafka Consumer
#     |
#     v
# PostgreSQL Idempotent Inbox
#
# KAFKA MODE:
#
# - Apache Kafka 4.2.2.
# - KRaft mode without ZooKeeper.
# - One combined broker/controller instance.
# - One persistent Kubernetes volume.
#
# NETWORKING:
#
# Broker listener: 9092
# Controller listener: 9093
#
# SECURITY:
#
# - Kafka is accessible only inside Kubernetes.
# - No external NodePort or LoadBalancer.
# - The container runs without root privileges.
# - No Kubernetes API token is mounted.
#
# NOTE:
#
# This is a single-node local development broker.
# It is not a highly available production Kafka cluster.
#
# Production deployments require replicated brokers,
# appropriate controller quorum configuration,
# authenticated listeners, and network policies.


# ============================================================
# KAFKA HEADLESS SERVICE
# ============================================================
#
# Provides a stable DNS identity for the KRaft controller:
#
# kafka-0.kafka-headless.ledgerbase.svc.cluster.local
#
# The controller endpoint must remain consistent
# across Pod restarts.

apiVersion: v1
kind: Service

metadata:
  name: kafka-headless
  namespace: ledgerbase

  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: ledgerbase

spec:
  clusterIP: None

  # Publish Pod DNS records before readiness so the
  # broker/controller can discover its own identity.
  publishNotReadyAddresses: true

  selector:
    app.kubernetes.io/name: kafka

  ports:
    - name: broker
      port: 9092
      targetPort: broker
      protocol: TCP

    - name: controller
      port: 9093
      targetPort: controller
      protocol: TCP

---

# ============================================================
# KAFKA CLIENT SERVICE
# ============================================================
#
# Accounting Core will connect through:
#
# kafka:9092
#
# This Service remains internal to the namespace.

apiVersion: v1
kind: Service

metadata:
  name: kafka
  namespace: ledgerbase

  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: ledgerbase

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: kafka

  ports:
    - name: broker
      port: 9092
      targetPort: broker
      protocol: TCP

---

# ============================================================
# KAFKA PERSISTENT STATEFULSET
# ============================================================

apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: kafka
  namespace: ledgerbase

  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: ledgerbase

spec:

  # Single-node KRaft development broker.
  replicas: 1

  serviceName: kafka-headless

  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app.kubernetes.io/name: kafka

  template:

    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: ledgerbase

    spec:

      # No access to the Kubernetes API is required.
      automountServiceAccountToken: false

      # The Apache Kafka JVM image uses appuser
      # with UID/GID 1000.
      #
      # fsGroup supports access to persistent
      # storage provided through the local-path
      # StorageClass.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      terminationGracePeriodSeconds: 60

      containers:

        - name: kafka

          # ==================================================
          # CONTAINER IMAGE
          # ==================================================

          image: apache/kafka:4.2.2
          imagePullPolicy: IfNotPresent

          ports:
            - name: broker
              containerPort: 9092
              protocol: TCP

            - name: controller
              containerPort: 9093
              protocol: TCP

          # ==================================================
          # KAFKA CONFIGURATION
          # ==================================================

          env:

            # ------------------------------------------------
            # STABLE KRAFT CLUSTER ID
            # ------------------------------------------------
            #
            # Generated once during Kubernetes setup.
            #
            # Must remain unchanged while the Kafka
            # persistent volume is retained.

            - name: CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: ledgerbase-kafka-cluster-id
                  key: cluster-id

            # ------------------------------------------------
            # BROKER AND CONTROLLER IDENTITY
            # ------------------------------------------------

            - name: KAFKA_NODE_ID
              value: "1"

            # Run broker and controller together.
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"

            # ------------------------------------------------
            # KRAFT CONTROLLER QUORUM
            # ------------------------------------------------
            #
            # Single voting controller for local
            # Kubernetes development.
            #
            # Uses the stable StatefulSet Pod DNS name.

            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka-headless.ledgerbase.svc.cluster.local:9093"

            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"

            # ------------------------------------------------
            # KAFKA LISTENERS
            # ------------------------------------------------
            #
            # Listen on all Pod interfaces.
            #
            # PLAINTEXT is the application broker listener.
            # CONTROLLER is used for KRaft metadata.

            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"

            # Advertise an address that Kubernetes
            # applications can resolve.
            #
            # Never advertise localhost here.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"

            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"

            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"

            # ------------------------------------------------
            # SINGLE-BROKER REPLICATION SETTINGS
            # ------------------------------------------------
            #
            # Kafka internal topics must use replication
            # factor 1 because there is only one broker.
            #
            # These values are development-only.

            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"

            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"

            # ------------------------------------------------
            # EXPLICIT TOPIC MANAGEMENT
            # ------------------------------------------------
            #
            # Create the financial event topic separately,
            # after verifying the broker.
            #
            # Do not silently create new topics because
            # of an incorrect application topic name.

            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"

            # ------------------------------------------------
            # PERSISTENT KAFKA LOG STORAGE
            # ------------------------------------------------
            #
            # Kafka messages and KRaft metadata are stored
            # on the persistent volume.
            #
            # The broker must retain its existing data
            # when the container restarts.

            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"

            # ------------------------------------------------
            # JVM MEMORY
            # ------------------------------------------------
            #
            # Keep the heap appropriate for the local
            # single-node kind environment.
            #
            # The container memory limit also covers
            # off-heap and operating system overhead.

            - name: KAFKA_HEAP_OPTS
              value: "-Xms256m -Xmx512m"

          # ==================================================
          # PERSISTENT VOLUME
          # ==================================================

          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data

          # ==================================================
          # CONTAINER SECURITY
          # ==================================================

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          # ==================================================
          # RESOURCE ALLOCATION
          # ==================================================

          resources:
            requests:
              cpu: 250m
              memory: 512Mi

            limits:
              cpu: "2"
              memory: 1536Mi

          # ==================================================
          # STARTUP PROBE
          # ==================================================
          #
          # KRaft metadata initialization and broker
          # startup may require additional time.
          #
          # Allow the listener to become available
          # before enforcing readiness and liveness.

          startupProbe:
            tcpSocket:
              port: broker

            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60

          # ==================================================
          # READINESS PROBE
          # ==================================================
          #
          # Verify that Kafka responds to a broker API
          # request rather than checking TCP alone.
          #
          # Do not route application traffic until
          # the broker can serve Kafka clients.

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >
                  /opt/kafka/bin/kafka-broker-api-versions.sh
                  --bootstrap-server localhost:9092
                  >/dev/null 2>&1

            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6

          # ==================================================
          # LIVENESS PROBE
          # ==================================================
          #
          # Verify that the broker listener remains
          # available without running an expensive
          # Kafka administration command.

          livenessProbe:
            tcpSocket:
              port: broker

            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

  # ==========================================================
  # PERSISTENT KAFKA STORAGE
  # ==========================================================
  #
  # The volume stores both Kafka event records
  # and the KRaft metadata for this broker.
  #
  # Do not delete this PVC when restarting
  # or redeploying Kafka.

  volumeClaimTemplates:

    - metadata:
        name: kafka-data

      spec:
        accessModes:
          - ReadWriteOnce

        storageClassName: standard

        resources:
          requests:
            storage: 5Gi
