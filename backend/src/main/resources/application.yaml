# ==========================================
# LedgerBase - Spring Boot Configuration
# ==========================================

spring:
  # Application name
  application:
    name: ledgerbase-backend

  # PostgreSQL database running inside Docker
  datasource:
    # Mac port 5434 maps to PostgreSQL port 5432
    url: jdbc:postgresql://localhost:5434/ledgerbase
    username: ledgerbase

    # Password loaded from a Terminal environment variable
    password: ${POSTGRES_PASSWORD}

    driver-class-name: org.postgresql.Driver

  # Flyway manages our database schema migrations
  flyway:
    enabled: true

    # Folder containing versioned SQL migration files
    locations: classpath:db/migration

    # Require a clean migration history
    baseline-on-migrate: false

# MyBatis configuration for executing SQL
mybatis:
  mapper-locations: classpath:mapper/*.xml

  # Map SQL snake_case columns to Java camelCase fields
  configuration:
    map-underscore-to-camel-case: true

# Spring Boot HTTP server
server:
  port: 8080

# Application monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info

# ============================================================
# JWT AUTHENTICATION CONFIGURATION
# ============================================================

# The signing key comes from the JWT_SECRET_BASE64
# environment variable.
#
# No default signing key is provided. Application startup
# must fail when the secret is missing or invalid.
#
# JWT issuer and audience identify LedgerBase tokens
# and prevent tokens intended for another service
# from being accepted accidentally.

ledgerbase:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:}
    issuer: ledgerbase
    audience: ledgerbase-api
