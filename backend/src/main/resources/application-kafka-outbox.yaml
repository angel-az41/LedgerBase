# ============================================================
# LEDGERBASE — LOCAL KAFKA OUTBOX PUBLISHER
# ============================================================
#
# This profile enables asynchronous publication of committed
# financial outbox events.
#
# Activate explicitly with:
#
#   -Dspring-boot.run.profiles=kafka-outbox
#
# Normal backend and test profiles do not enable the publisher.
#
# Kafka is not part of the journal posting transaction.

spring:
  kafka:
    bootstrap-servers: ${LEDGERBASE_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

      # Require acknowledgment from all in-sync replicas.
      # Our local Kafka broker has replication factor 1.
      acks: all

      properties:
        # Avoid unnecessary duplicate records during
        # eligible internal Kafka producer retries.
        "[enable.idempotence]": true

        # Limit how long producer.send() can block while
        # waiting for metadata or buffer availability.
        "[max.block.ms]": 5000

        # Broker request and overall delivery time limits.
        "[request.timeout.ms]": 10000
        "[delivery.timeout.ms]": 30000

    
    # ============================================================
    # DURABLE FINANCIAL EVENT CONSUMER
    # ============================================================
    consumer:
      group-id: ledgerbase-transaction-posted-inbox-v1
      auto-offset-reset: earliest
      enable-auto-commit: false

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    # The Kafka offset is acknowledged explicitly after
    # the PostgreSQL processing transaction commits.
    listener:
      ack-mode: manual_immediate


ledgerbase:
  kafka:
    outbox:
      publisher:
        enabled: true

        # Poll PostgreSQL once a second.
        poll-ms: 1000
    
    inbox:
      consumer:
        enabled: true
        topic: ledgerbase.transaction-posted.v1
