# ============================================================
# LEDGERBASE — FINANCIAL REPORTING SERVICE
# ============================================================
#
# Independent Spring Boot service for financial reporting.
#
# DATA SOURCES:
#
# PostgreSQL read replica:
#   - Authoritative reporting calculations
#   - Read-only financial SQL
#
# Redis Cluster:
#   - Connected during this checkpoint
#   - Financial report caching not yet enabled
#
# Accounting Core:
#   - Active JWT session verification
#   - Business-scoped authorization

spring:

  application:
    name: ledgerbase-reporting-service

  # ==========================================================
  # POSTGRESQL READ REPLICA DATASOURCE
  # ==========================================================

  datasource:

    # Local PostgreSQL standby.
    url: jdbc:postgresql://127.0.0.1:5435/ledgerbase

    # Restricted database login.
    username: ledgerbase_reader

    # Loaded from the environment.
    password: ${POSTGRES_REPLICA_PASSWORD}

    hikari:

      # Dedicated read-only connection pool.
      pool-name: ledgerbase-reporting-replica-pool

      maximum-pool-size: 4
      minimum-idle: 0

      # Reporting queries must never perform writes.
      read-only: true

      # Fail promptly when the replica is unavailable.
      connection-timeout: 5000
      validation-timeout: 2000

  # ==========================================================
  # REDIS CLUSTER — DISTRIBUTED CACHE CONNECTION
  # ==========================================================

  data:
    redis:

      # Lettuce supports cluster-aware routing and
      # is the default Spring Data Redis client.
      client-type: lettuce

      # ------------------------------------------------------
      # REDIS CLUSTER NODES
      # ------------------------------------------------------

      # Seed addresses used to discover the cluster.
      #
      # Redis Cluster assigns 16,384 hash slots across
      # its primary nodes.
      #
      # The six local ports are mapped from Docker
      # to the macOS host.
      #
      # These localhost addresses are development-only.
      # Containerized Spring services will need a
      # different network configuration.

      cluster:
        nodes:
          - 127.0.0.1:7000
          - 127.0.0.1:7001
          - 127.0.0.1:7002
          - 127.0.0.1:7003
          - 127.0.0.1:7004
          - 127.0.0.1:7005

        # Allow cluster redirects when the requested
        # key belongs to another primary node.
        max-redirects: 5

      # ------------------------------------------------------
      # REDIS AUTHENTICATION
      # ------------------------------------------------------

      # Same password as the Docker Redis Cluster.
      #
      # Loaded from the root .env when exported into
      # the Spring Boot process environment.
      #
      # The empty default allows ordinary application
      # startup without the Redis password configured.
      # The explicit connectivity test still requires
      # correct credentials.
      #
      # Never commit the actual secret.

      password: ${REDIS_PASSWORD:}

      # ------------------------------------------------------
      # REDIS CONNECTION TIMEOUTS
      # ------------------------------------------------------

      # Bound connection and command waiting times.
      #
      # These will also support fast cache-failure
      # fallback when caching is introduced later.

      connect-timeout: 2s
      timeout: 2s

      # ------------------------------------------------------
      # LETTUCE CLUSTER TOPOLOGY REFRESH
      # ------------------------------------------------------

      # Allow Lettuce to refresh cluster information
      # after topology changes and periodically.
      #
      # No Redis application keys are created by
      # this configuration alone.

      lettuce:
        cluster:
          refresh:
            adaptive: true
            period: 30s

      # ------------------------------------------------------
      # REDIS REPOSITORIES
      # ------------------------------------------------------

      # We will use StringRedisTemplate for explicit
      # cache-aside operations, not Redis repositories.

      repositories:
        enabled: false

# ============================================================
# REPORTING HTTP SERVER
# ============================================================

server:

  # Independent Reporting Service port.
  port: 8082

  # Local development binding.
  address: 127.0.0.1

# ============================================================
# ACTUATOR HEALTH MONITORING
# ============================================================

management:

  # ----------------------------------------------------------
  # HEALTH CHECK CONFIGURATION
  # ----------------------------------------------------------

  health:

    # Redis is an optional cache dependency.
    #
    # A Redis outage should not automatically make
    # the Reporting Service's database-backed
    # health endpoint return DOWN.
    #
    # Redis availability will be observed separately
    # when cache monitoring is implemented.

    redis:
      enabled: false

  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

# ============================================================
# LOGGING
# ============================================================

logging:
  level:
    com.ledgerbase.reporting: INFO

# ============================================================
# MYBATIS FINANCIAL REPORTING CONFIGURATION
# ============================================================

mybatis:

  # Load existing XML financial reporting queries.
  mapper-locations: classpath*:mapper/*.xml

  configuration:

    # Map PostgreSQL snake_case columns to
    # corresponding Java camelCase properties.
    map-underscore-to-camel-case: true

# ============================================================
# JWT AUTHENTICATION CONFIGURATION
# ============================================================

ledgerbase:

  jwt:

    # Reporting Service verifies JWT access tokens
    # issued by Accounting Core.
    #
    # Both applications must use the same HS256
    # signing secret, issuer, and audience.
    #
    # The signing secret must never be committed.

    secret-base64: ${JWT_SECRET_BASE64:}

    issuer: ledgerbase
    audience: ledgerbase-api

  # ==========================================================
  # ACCOUNTING CORE AUTHORIZATION SERVICE
  # ==========================================================

  accounting-core:

    # Reporting Service calls Accounting Core directly
    # to verify active JWT sessions and business roles.
    #
    # Do not route this authorization check through
    # the public Spring Cloud Gateway.
    #
    # A future container deployment must override
    # this localhost development address.

    base-url: ${ACCOUNTING_CORE_BASE_URL:http://127.0.0.1:8080}
