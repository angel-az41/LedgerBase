# ============================================================
# LEDGERBASE — FRONTEND NGINX CONFIGURATION
# ============================================================
#
# PURPOSE:
#
# Serve the compiled React single-page application
# and forward backend API requests to Spring Cloud
# Gateway using Docker service discovery.
#
# The browser accesses the same frontend origin
# for both page assets and API requests.
#
# React Router paths fall back to index.html.
#
# This configuration is intended for local Docker
# deployment. Production TLS termination and
# additional security hardening are separate.

server {

    listen 80;

    server_name _;

    root /usr/share/nginx/html;

    index index.html;

    # ========================================================
    # BACKEND API PROXY
    # ========================================================

    location /api/ {

        # Gateway is reachable using Docker DNS.
        #
        # No trailing slash is used so the complete
        # original /api/... request path is preserved.
        proxy_pass http://gateway:8081;

        proxy_http_version 1.1;

        # Preserve useful request metadata.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward JWT Bearer authentication.
        proxy_set_header Authorization $http_authorization;
    }

    # ========================================================
    # REACT SINGLE-PAGE APPLICATION
    # ========================================================

    location / {

        # Serve existing static assets directly.
        #
        # If the requested path does not correspond
        # to a static file, return index.html so
        # React Router can resolve the client route.
        try_files $uri $uri/ /index.html;
    }
}
